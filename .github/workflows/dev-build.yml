name: Build Dev Image

on:
  push:
    branches:
      - dev  # replace with your actual branch name

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        id: vars
        run: |
          github_sha_hash=${{ github.sha }}
          echo "version=dev:${github_sha_hash:0:7}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/rhill051/audiobookrequest:dev
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}